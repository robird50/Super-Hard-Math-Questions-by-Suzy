name: Publish game
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download game package
        run: |
          curl --fail --location --retry 5 --retry-delay 5 https://github.com/robird50/Super-Hard-Math-Questions-by-Suzy/releases/download/v1.0.0/suzysays-web.zip -o game.zip
          mkdir site
          unzip -q game.zip -d site
      - name: Reduce rendering load
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/scripts/main.js')
          s = p.read_text()
          assert s.count('devicePixelRatio:window.devicePixelRatio') == 3
          s = s.replace('devicePixelRatio:window.devicePixelRatio', 'devicePixelRatio:Math.min(window.devicePixelRatio,1,1280/window.innerWidth,720/window.innerHeight)')
          s = s.replace('    setInterval(repairSettings, 16);', '')
          p.write_text(s)
          p = Path('site/scripts/macos.js')
          s = p.read_text()
          cap = 'Object.defineProperty(window, "devicePixelRatio", { configurable: true, get: () => Math.min(1, 1280 / window.innerWidth, 720 / window.innerHeight) });'
          p.write_text(cap + '\n' + s)
          PY
      - name: Replace TV horror frames
        run: |
          curl --fail --location --retry 5 https://github.com/robird50/Super-Hard-Math-Questions-by-Suzy/releases/download/v1.0.0/tv-replacement.png -o site/images/tv-replacement.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('site/data.json')
          data = json.loads(p.read_text())
          tv = next(o for o in data['project'][3] if o[0] == 'TVScreen')
          size = Path('site/images/tv-replacement.png').stat().st_size
          count = 0
          for animation in tv[7]:
              if animation[0] in ['GlitchA', 'GlitchB', 'GlitchC', 'Symbols', 'Error']:
                  for frame in animation[7]:
                      frame[:7] = ['images/tv-replacement.png', size, 0, 450, 864, 648, False]
                      count += 1
          assert count == 50
          p.write_text(json.dumps(data, separators=(',', ':')))
          PY
      - name: Start fresh on every page load
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/scripts/c3main.js')
          s = p.read_text()
          old = 'self.localforage=new ea(new Qr("localforage"))'
          assert s.count(old) == 1
          s = s.replace(old, 'self.localforage=(()=>{const stores=new Map;function createInstance({name="localforage"}={}){if(stores.has(name))return stores.get(name);const data=new Map;const store={async getItem(key){return data.has(key)?structuredClone(data.get(key)):null},async setItem(key,value){data.set(key,structuredClone(value));return value},async removeItem(key){data.delete(key)},async clear(){data.clear()},async keys(){return [...data.keys()]},async length(){return data.size},async key(index){return [...data.keys()][index]??null}};stores.set(name,store);return store}return Object.assign(createInstance(),{createInstance})})()')
          p.write_text(s)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: game-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for artifact availability
        run: sleep 15
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: game-${{ github.run_id }}-${{ github.run_attempt }}
