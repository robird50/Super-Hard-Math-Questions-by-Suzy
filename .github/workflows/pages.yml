name: Publish game
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download game package
        run: |
          curl --fail --location --retry 5 --retry-delay 5 https://github.com/robird50/Super-Hard-Math-Questions-by-Suzy/releases/download/v1.0.0/suzysays-web.zip -o game.zip
          mkdir site
          unzip -q game.zip -d site
      - name: Reduce rendering load
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('site/scripts/main.js')
          s = p.read_text()
          assert s.count('devicePixelRatio:window.devicePixelRatio') == 3
          s = s.replace('devicePixelRatio:window.devicePixelRatio', 'devicePixelRatio:Math.min(window.devicePixelRatio,1,1280/window.innerWidth,720/window.innerHeight)')
          s = s.replace('    setInterval(repairSettings, 16);', '')
          p.write_text(s)
          p = Path('site/scripts/macos.js')
          s = p.read_text()
          cap = 'Object.defineProperty(window, "devicePixelRatio", { configurable: true, get: () => Math.min(1, 1280 / window.innerWidth, 720 / window.innerHeight) });'
          p.write_text(cap + '\n' + s)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
